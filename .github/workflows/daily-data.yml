name: Daily data update
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
concurrency: daily-data
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Prepare data branch
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "$URL" data-out
          else
            mkdir data-out && git -C data-out init -q -b data && git -C data-out remote add origin "$URL"
          fi
      - name: Collect and compute
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: cd backend && python -m app.publish ../data-out
      - name: Publish
        run: |
          cd data-out
          git config user.name "radar-bot" && git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nessuna novita'" && exit 0
          git commit -q -m "Data update $(date -u +%F)"
          git push origin data
